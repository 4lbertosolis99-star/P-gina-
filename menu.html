<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0508">
<title>Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #E5173F;
    --rojo-oscuro: #8B0000;
    --fondo: #1a0508;
    --texto: #fff;
    --texto-suave: rgba(255,255,255,.65);
    --vidrio: rgba(255,255,255,.08);
    --borde: rgba(255,255,255,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: var(--rojo) transparent;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(var(--rojo), var(--rojo-oscuro)); border-radius: 8px; }

  body {
    font-family: 'Outfit', 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  /* Fondo animado: manchas de luz roja que se desplazan lento */
  .fondo { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(circle at 50% 0%, #3a0a12 0%, var(--fondo) 70%); }
  .fondo i {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .55;
    will-change: transform;
  }
  .fondo i:nth-child(1) { width: 60vmax; height: 60vmax; background: var(--rojo); top: -20vmax; left: -15vmax; animation: flota1 18s ease-in-out infinite alternate; }
  .fondo i:nth-child(2) { width: 50vmax; height: 50vmax; background: var(--rojo-oscuro); bottom: -18vmax; right: -12vmax; animation: flota2 22s ease-in-out infinite alternate; }
  .fondo i:nth-child(3) { width: 35vmax; height: 35vmax; background: #ff5a36; opacity: .3; top: 35%; left: 45%; animation: flota3 26s ease-in-out infinite alternate; }
  @keyframes flota1 { to { transform: translate(30vmax, 20vmax) scale(1.15); } }
  @keyframes flota2 { to { transform: translate(-28vmax, -18vmax) scale(1.2); } }
  @keyframes flota3 { to { transform: translate(-25vmax, 15vmax) scale(.8); } }

  .card {
    background: var(--vidrio);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid var(--borde);
    border-radius: 24px;
    max-width: 420px;
    width: 100%;
    padding: 36px 24px 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
  }
  h1 { font-size: 26px; font-weight: 700; line-height: 1.2; text-align: center; letter-spacing: -.01em; }
  .sub { text-align: center; color: var(--texto-suave); font-size: 15px; margin: 8px 0 22px; }

  .btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 16px;
    border: 1px solid var(--borde);
    border-radius: 14px;
    background: rgba(255,255,255,.06);
    color: var(--texto);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .btn:hover { background: var(--rojo); border-color: var(--rojo); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(229,23,63,.45); }
  .btn:active { transform: translateY(0) scale(.98); background: var(--rojo); border-color: var(--rojo); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn.copied { background: #2e7d32; border-color: #2e7d32; box-shadow: 0 10px 25px rgba(46,125,50,.4); }

  #datos {
    display: none;
    margin-top: 14px;
    background: rgba(0,0,0,.28);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 4px 16px;
  }
  #datos.open { display: block; animation: abrir .35s ease both; }
  @keyframes abrir { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .field { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.12); }
  .field:last-child { border-bottom: none; }
  .label { font-size: 12px; color: var(--texto-suave); }
  .value { font-size: 15px; font-weight: 600; word-break: break-word; }

  /* Entrada de la tarjeta: una sola secuencia al cargar */
  .entra { opacity: 0; transform: translateY(18px); animation: entra .7s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes entra { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .fondo i, .entra, #datos.open { animation: none; }
    .entra { opacity: 1; transform: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="fondo" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="card" id="card"></main>

<script>
const p = new URLSearchParams(location.search);
const card = document.getElementById("card");

function urlSegura(u) {
  u = (u || "").trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try {
    const x = new URL(u);
    return (x.protocol === "http:" || x.protocol === "https:") ? x.href : "";
  } catch (e) { return ""; }
}

function instagramUrl(v) {
  v = (v || "").trim().replace(/^@/, "");
  if (!v) return "";
  if (/instagram\.com/i.test(v) || /^https?:\/\//i.test(v)) return urlSegura(v);
  return "https://www.instagram.com/" + encodeURIComponent(v);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function enlace(texto, href) {
  const a = el("a", "btn", texto);
  a.href = href;
  a.target = "_blank";
  a.rel = "noopener";
  return a;
}

const negocio = (p.get("n") || "").trim();
card.appendChild(el("h1", "", negocio ? "¡Gracias por visitar " + negocio + "!" : "¡Gracias por visitarnos!"));
card.appendChild(el("p", "sub", "Elige una opción"));
if (negocio) document.title = negocio;

const ig = instagramUrl(p.get("ig"));
const maps = urlSegura(p.get("maps"));
const carta = urlSegura(p.get("carta"));
const catalogo = urlSegura(p.get("catalogo"));

if (carta) card.appendChild(enlace("Ver carta", carta));
if (catalogo) card.appendChild(enlace("Ver catálogo", catalogo));
if (ig) card.appendChild(enlace("Instagram", ig));
if (maps) card.appendChild(enlace("Valóranos en Google Maps", maps));

const DATOS = [
  ["Nombre", p.get("tn")],
  ["RUT", p.get("rut")],
  ["Banco", p.get("banco")],
  ["Tipo de cuenta", p.get("tipo")],
  ["N° de cuenta", p.get("cuenta")]
].filter(d => d[1] && d[1].trim()).map(d => [d[0], d[1].trim()]);

if (DATOS.length) {
  const btn = el("button", "btn", "Transferencia");
  btn.type = "button";
  const panel = el("div");
  panel.id = "datos";
  panel.setAttribute("aria-live", "polite");
  DATOS.forEach(([l, v]) => {
    const f = el("div", "field");
    f.appendChild(el("div", "label", l));
    f.appendChild(el("div", "value", v));
    panel.appendChild(f);
  });
  card.appendChild(btn);
  card.appendChild(panel);

  function copiar(texto) {
    return new Promise((ok, fail) => {
      function respaldo() {
        const t = document.createElement("textarea");
        t.value = texto;
        t.setAttribute("readonly", "");
        t.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px;";
        document.body.appendChild(t);
        t.focus();
        t.select();
        t.setSelectionRange(0, texto.length);
        let r = false;
        try { r = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(t);
        r ? ok() : fail();
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(texto).then(ok).catch(respaldo);
      } else {
        respaldo();
      }
    });
  }

  btn.addEventListener("click", () => {
    panel.classList.add("open");
    setTimeout(() => panel.scrollIntoView({ behavior: "smooth", block: "nearest" }), 50);
    copiar(DATOS.map(([l, v]) => l + ": " + v).join("\n")).then(() => {
      btn.textContent = "¡Datos copiados!";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "Transferencia"; btn.classList.remove("copied"); }, 2000);
    }).catch(() => { btn.textContent = "No se pudo copiar: mantén presionado un dato"; });
  });
}

if (!carta && !catalogo && !ig && !maps && !DATOS.length) {
  card.appendChild(el("p", "sub", "Este menú aún no tiene opciones configuradas."));
}

// Entrada escalonada: el título y cada botón aparecen uno tras otro al cargar
Array.from(card.children).filter(c => c.id !== "datos").forEach((c, i) => {
  c.classList.add("entra");
  c.style.animationDelay = (0.1 + i * 0.09) + "s";
});
</script>
</body>
</html>
